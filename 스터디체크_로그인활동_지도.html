<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스터디체크 로그인 활동 지도</title>
<style>
  :root{
    --bg:#05060f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:#eef1f8;
    font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    overflow:hidden;
    width:100%;height:100%;
  }
  #stage{
    position:relative;
    width:100vw;height:100vh;
    overflow:hidden;
  }
  /* soft aurora blobs */
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.38;
    mix-blend-mode:screen;
    pointer-events:none;
    animation:drift 26s ease-in-out infinite;
  }
  @keyframes drift{
    0%{transform:translate(0,0) scale(1);}
    33%{transform:translate(3%,-4%) scale(1.08);}
    66%{transform:translate(-3%,3%) scale(0.94);}
    100%{transform:translate(0,0) scale(1);}
  }
  .star{
    position:absolute;
    width:2px;height:2px;
    background:#ffffff;
    border-radius:50%;
    opacity:0.5;
  }
  .node{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    pointer-events:none;
    animation:bob 6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{margin-top:0px;}
    50%{margin-top:-6px;}
  }
  .dot{
    border-radius:50%;
    position:relative;
  }
  .dot.hot{
    background:conic-gradient(from 0deg,
      #ff3b3b,#ff9f1c,#ffe14d,#4dff88,#3ddcff,#5c6bff,#c04dff,#ff3b3b);
    animation:spin 5s linear infinite;
    box-shadow:0 0 18px 4px rgba(255,255,255,0.35),0 0 40px 12px currentColor;
  }
  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  .dot.warm{
    box-shadow:0 0 14px 3px currentColor;
  }
  .dot.cold{
    opacity:0.85;
    box-shadow:0 0 6px 1px currentColor;
  }
  .dot.none{
    background:#3a3f52 !important;
    opacity:0.55;
    box-shadow:none;
  }
  .label{
    margin-top:4px;
    white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,0.9);
    pointer-events:none;
  }
  #hud{
    position:absolute;
    top:18px;left:22px;
    z-index:20;
  }
  #hud h1{
    margin:0;
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  #hud p{
    margin:4px 0 0;
    font-size:12px;
    color:#9aa3c0;
  }
  #legend{
    position:absolute;
    bottom:18px;left:22px;
    z-index:20;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    max-width:70vw;
  }
  .legend-item{
    display:flex;align-items:center;gap:6px;
    font-size:11px;color:#c7cde3;
    background:rgba(255,255,255,0.05);
    padding:5px 10px;border-radius:999px;
    backdrop-filter:blur(4px);
  }
  .legend-swatch{
    width:10px;height:10px;border-radius:50%;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <h1>🌈 스터디체크 로그인 활동 지도</h1>
    <p id="subtitle">불러오는 중...</p>
  </div>
  <div id="legend"></div>
</div>

const now = new Date('2026-08-13T00:00:00Z').getTime();

function daysAgo(ts){
  if(!ts) return Infinity;
  let s = ts.replace(' ','T');
  s = s.replace(/([+-]\d{2})$/, '$1:00');
  const t = new Date(s).getTime();
  if(isNaN(t)) return Infinity;
  return (now - t) / 86400000;
}

const stage = document.getElementById('stage');
const W = window.innerWidth, H = window.innerHeight;

const students = RAW.map(r => {
  const sD = daysAgo(r.student_last_login_at);
  const pD = daysAgo(r.parent_last_login_at);
  const best = Math.min(sD, pD);
  let tier;
  if(!isFinite(best)) tier = 'none';
  else if(best <= 7) tier = 'hot';
  else if(best <= 30) tier = 'warm';
  else tier = 'cold';
  return {...r, bestDays: best, tier};
});

// sort so hottest first (drawn last / on top visually not critical)
students.sort((a,b)=>a.bestDays-b.bestDays);

const counts = {hot:0,warm:0,cold:0,none:0};
students.forEach(s=>counts[s.tier]++);
document.getElementById('subtitle').textContent =
  `총 ${students.length}명 · 최근 7일 ${counts.hot} · 이번달 ${counts.warm} · 오래전 ${counts.cold} · 한번도 안함 ${counts.none}`;

// legend
const legendDefs = [
  {tier:'hot', color:'#ffd23f', label:'최근 7일 이내 로그인 (무지개 원)'},
  {tier:'warm', color:'#3ddc84', label:'이번 달 로그인'},
  {tier:'cold', color:'#3b82f6', label:'오래 전 로그인'},
  {tier:'none', color:'#6b7280', label:'한 번도 로그인 안함'},
];
const legendEl = document.getElementById('legend');
legendDefs.forEach(d=>{
  const el = document.createElement('div');
  el.className='legend-item';
  el.innerHTML = `<span class="legend-swatch" style="background:${d.color}"></span>${d.label}`;
  legendEl.appendChild(el);
});

// color per tier (for warm/cold glow color)
function tierColor(tier, idx){
  if(tier==='warm'){
    const palette=['#3ddc84','#06d6a0','#2dd4bf','#4ade80'];
    return palette[idx % palette.length];
  }
  if(tier==='cold'){
    const palette=['#3b82f6','#60a5fa','#818cf8','#38bdf8'];
    return palette[idx % palette.length];
  }
  return '#6b7280';
}

function sizeFor(tier){
  if(tier==='hot') return 34 + Math.random()*14;
  if(tier==='warm') return 26 + Math.random()*10;
  if(tier==='cold') return 14 + Math.random()*6;
  return 8 + Math.random()*4;
}

// initial placement: hot near center, others further out by tier, random angle
const cx = W*0.5, cy = H*0.52;
const ringRadius = {hot: () => 40 + Math.random()*140, warm: () => 170 + Math.random()*170, cold: () => 300 + Math.random()*(Math.min(W,H)*0.42), none: () => 340 + Math.random()*(Math.min(W,H)*0.46)};

let warmI=0, coldI=0;
const nodes = students.map(s=>{
  const angle = Math.random()*Math.PI*2;
  const r = ringRadius[s.tier]();
  const size = sizeFor(s.tier);
  let color;
  if(s.tier==='warm'){ color = tierColor('warm', warmI++); }
  else if(s.tier==='cold'){ color = tierColor('cold', coldI++); }
  else if(s.tier==='none'){ color = tierColor('none',0); }
  else { color = '#ffd23f'; }
  return {
    ...s,
    x: cx + Math.cos(angle)*r,
    y: cy + Math.sin(angle)*r,
    size, color,
  };
});

// simple repulsion pass to reduce overlap (few iterations, cheap for ~190 nodes)
for(let iter=0; iter<120; iter++){
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      let dist=Math.sqrt(dx*dx+dy*dy)||0.001;
      const minDist=(a.size+b.size)/2 + 10;
      if(dist < minDist){
        const push=(minDist-dist)/2;
        const nx=dx/dist, ny=dy/dist;
        a.x -= nx*push; a.y -= ny*push;
        b.x += nx*push; b.y += ny*push;
      }
    }
  }
  // keep within bounds softly
  nodes.forEach(n=>{
    n.x = Math.max(n.size, Math.min(W-n.size, n.x));
    n.y = Math.max(n.size+60, Math.min(H-n.size-40, n.y));
  });
}

// render
const frag = document.createDocumentFragment();
nodes.forEach((n,idx)=>{
  const wrap = document.createElement('div');
  wrap.className='node';
  wrap.style.left = n.x+'px';
  wrap.style.top = n.y+'px';
  wrap.style.animationDelay = (Math.random()*6).toFixed(2)+'s';
  wrap.style.color = n.color;

  const dot = document.createElement('div');
  dot.className = 'dot ' + n.tier;
  dot.style.width = n.size+'px';
  dot.style.height = n.size+'px';
  if(n.tier!=='hot' && n.tier!=='none'){
    dot.style.background = n.color;
  }
  if(n.tier==='hot'){
    dot.style.animationDuration = (4+Math.random()*3).toFixed(2)+'s';
  }
  wrap.appendChild(dot);

  if(n.size >= 20 || n.tier==='hot'){
    const label = document.createElement('div');
    label.className='label';
    label.style.fontSize = (n.tier==='hot' ? 13 : n.tier==='warm' ? 11 : 10)+'px';
    label.style.fontWeight = n.tier==='hot' ? '800' : '500';
    label.style.color = n.tier==='none' ? '#8a90a8' : '#e7eaf6';
    label.textContent = n.name;
    wrap.appendChild(label);
  }

  frag.appendChild(wrap);
});
stage.appendChild(frag);

for(let i=0;i<5;i++){

  b.style.animationDuration = (20+Math.random()*14).toFixed(2)+'s';

}

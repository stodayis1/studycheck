<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 원본은 Claude 아티팩트로도 올라가 있다. 고칠 때는 이 파일을 고치고 아티팩트도 같이 다시 올린다 -->
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>회전체 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* 왼쪽: 모눈 위에 평면도형 그리기(왼쪽 세로선이 회전축) / 오른쪽: 돌려서 생긴 입체. 아래: 자르는 평면과 단면 */
/* 수학의지혜 색(파란 교복 + 주황 글씨)으로 밝게. 어두운 화면 모드는 두지 않는다 */
:root {
  --bg: #f4f9ff;
  --surface: #ffffff;
  --ink: #1d2b3a;
  --muted: #5b6b7d;
  --grid: #dceafa;
  --grid-strong: #bcd5f2;
  --line: #d3e1f0;
  --accent: #2563eb;
  --accent-soft: #e3edff;
  --brand: #f26b1d;
  --wood: #ffcf86;
  --wood-edge: #c98a2e;
  --ok: #16a34a;
  --warn: #d97706;
  --shape: #f97316;
  --shape-fill: rgba(249, 115, 22, 0.25);
  --axis: #e11d48;
  --cut: #2563eb;
  --cut-fill: rgba(37, 99, 235, 0.18);
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.brand img { height: 64px; width: auto; display: block; }
.brand b { display: block; font-family: var(--font-display); font-size: 22px; color: var(--brand); letter-spacing: 0.02em; }
.brand span { display: block; font-size: 12px; color: var(--accent); letter-spacing: 0.06em; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
header h1 { font-family: var(--font-display); font-size: clamp(26px, 4vw, 34px); margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--accent); }
h2 { font-family: var(--font-display); font-size: 17px; margin: 0; }
.main { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.sub { margin: -6px 0 0; font-size: 13px; color: var(--muted); }
.presets, .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn, .chip { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.chip { border-radius: 999px; background: var(--surface); }
.btn[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:focus-visible, .chip:focus-visible, canvas:focus-visible, input:focus-visible, .handle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#editor { width: 100%; max-width: 330px; justify-self: center; display: block; touch-action: none; user-select: none; }
#editor .g { stroke: var(--grid); stroke-width: 1; }
#editor .g.s { stroke: var(--grid-strong); }
#editor .axis { stroke: var(--axis); stroke-width: 2.5; stroke-dasharray: 8 5; }
#editor .axisLabel { fill: var(--axis); font-size: 13px; font-family: var(--font-body); }
#editor .tick { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
#editor .poly { fill: var(--shape-fill); stroke: var(--shape); stroke-width: 2.5; stroke-linejoin: round; }
#editor .handle { fill: var(--surface); stroke: var(--shape); stroke-width: 2.5; cursor: grab; }
#editor .handle.sel { fill: var(--shape); }
#editor .hit { fill: transparent; cursor: grab; }
#editor .poly.move { cursor: move; }
#editor .edgeHit { stroke: transparent; stroke-width: 16; fill: none; cursor: copy; }
#editor .edgeSel { stroke: var(--accent); stroke-width: 5; fill: none; stroke-linecap: round; pointer-events: none; }
#editor .draft { fill: none; stroke: var(--shape); stroke-width: 2.5; stroke-dasharray: 6 4; }
#editor .bg { fill: transparent; }
#editor.drawing { cursor: crosshair; }
.tool { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.tool .row label { font-size: 13px; color: var(--muted); }
#bend { flex: 1; min-width: 120px; accent-color: var(--accent); }
#bendOut { font-variant-numeric: tabular-nums; min-width: 2.6em; text-align: right; }
.solidName { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed var(--line); padding-top: 10px; gap: 8px; }
.solidName b { font-family: var(--font-display); font-size: 22px; }
.solidName span { font-size: 13px; color: var(--muted); }

.stage { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; min-width: 0; }
#canvasBox { height: 500px; }
@media (max-width: 860px) { #canvasBox { height: 400px; } }
canvas#c { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#c:active { cursor: grabbing; }
.overlayTop { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
.overlayBottom { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: grid; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.sweep { display: flex; align-items: center; gap: 10px; }
.sweep input[type="range"] { flex: 1; min-width: 0; accent-color: var(--shape); }
.sweep output { font-variant-numeric: tabular-nums; min-width: 4.2em; text-align: right; font-family: var(--font-display); }
.hint { margin: 0; font-size: 12px; color: var(--muted); }

.cutGrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .cutGrid { grid-template-columns: minmax(0, 1fr); } }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row label { font-size: 13px; color: var(--muted); }
#hRow input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--cut); }
#hRow output { font-variant-numeric: tabular-nums; font-family: var(--font-display); }
#section { width: 100%; max-width: 380px; justify-self: center; display: block; }
#section .poly { fill: var(--cut-fill); stroke: var(--cut); stroke-width: 2.5; vector-effect: non-scaling-stroke; fill-rule: evenodd; }
#section .axis { stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
#section .lbl { fill: var(--ink); font-size: 0.42px; font-family: var(--font-body); }
#section .dim { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.secText { margin: 0; }
.secText b { font-family: var(--font-display); font-size: 20px; }
.secNote { margin: 0; font-size: 13px; color: var(--muted); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="brand"><img src="/visual/suji.png" alt=""><div><b>수학의지혜</b><span>Wise Way to Win</span></div></div>
    <div class="eyebrow">중1-2 입체도형의 성질 · 회전체</div>
    <h1>회전체 실험실</h1>
    <p>왼쪽 모눈에 평면도형을 놓고 회전축(빨간 점선) 둘레로 한 바퀴 돌리면 회전체가 됩니다. 꼭짓점을 끌어 모양을 바꾸고, 아래에서 회전체를 평면으로 잘라 단면을 확인해 보세요.</p>
  </header>

  <div class="main">
    <section class="card" aria-label="평면도형">
      <h2>돌릴 평면도형</h2>
      <p class="sub">고르거나 직접 그려 보세요. 꼭짓점·변·도형 안쪽을 끌 수 있어요.</p>
      <div class="presets" id="presets"></div>
      <svg id="editor" viewBox="0 0 330 330" role="img" aria-label="평면도형 편집 모눈"></svg>
      <div class="btns">
        <button class="btn" id="drawBtn">새로 그리기</button>
        <button class="btn primary" id="doneBtn" hidden>다 그렸어요</button>
        <button class="btn" id="delV">고른 꼭짓점 빼기</button>
      </div>
      <div class="tool">
        <div class="row">
          <label for="bend">고른 변 휘기</label>
          <input type="range" id="bend" min="-3" max="3" step="0.25" value="0" disabled>
          <output id="bendOut" for="bend">0</output>
        </div>
        <div class="row" role="group" aria-label="눈금 간격">
          <label>눈금 간격</label>
          <button class="chip" data-snap="1" aria-pressed="false">1칸</button>
          <button class="chip" data-snap="0.5" aria-pressed="true">0.5칸</button>
          <button class="chip" data-snap="0.25" aria-pressed="false">0.25칸</button>
        </div>
      </div>
      <p class="sub" id="editNote" style="margin:0"></p>
      <div class="solidName"><span>돌리면 생기는 회전체</span><b id="solidName">원기둥</b></div>
    </section>

    <section class="stage" aria-label="회전체 3D">
      <div class="overlayTop" role="group" aria-label="보는 방향">
        <button class="chip" data-view="iso">비스듬히</button>
        <button class="chip" data-view="front">앞에서</button>
        <button class="chip" data-view="top">위에서</button>
        <button class="chip" id="zoomIn" aria-label="확대">＋</button>
        <button class="chip" id="zoomOut" aria-label="축소">－</button>
      </div>
      <div id="canvasBox"><canvas id="c" tabindex="0" aria-label="회전체 3D 모형. 끌거나 화살표 키로 돌릴 수 있습니다."></canvas></div>
      <div class="overlayBottom">
        <div class="sweep">
          <button class="btn primary" id="play">한 바퀴 돌리기</button>
          <input type="range" id="angle" min="0" max="360" step="1" value="270" aria-label="돌린 각도">
          <output id="angleOut" for="angle">270°</output>
        </div>
        <p class="hint">끌어서 돌려 보기 · 휠·두 손가락으로 확대 · 막대로 돌린 각도 조절</p>
      </div>
    </section>
  </div>

  <section class="card" aria-label="단면">
    <div class="row" style="justify-content:space-between">
      <h2>평면으로 잘라 보기</h2>
      <label class="check"><input type="checkbox" id="cutToggle" checked> 잘린 입체로 보기</label>
    </div>
    <div class="row" role="group" aria-label="자르는 평면">
      <button class="chip" data-mode="none" aria-pressed="false">자르지 않기</button>
      <button class="chip" data-mode="axis" aria-pressed="true">회전축을 품은 평면</button>
      <button class="chip" data-mode="perp" aria-pressed="false">회전축에 수직인 평면</button>
    </div>
    <div class="row" id="hRow" hidden>
      <label for="height">자르는 높이</label>
      <input type="range" id="height" min="0" max="5" step="0.05" value="2">
      <output id="hOut" for="height">2.0</output>
    </div>
    <div class="cutGrid">
      <svg id="section" viewBox="-6.2 -3.6 12.4 7.2" role="img" aria-label="단면 모양"></svg>
      <div style="display:grid;gap:10px">
        <p class="secText">단면: <b id="secName">직사각형</b></p>
        <p class="secNote" id="secNote"></p>
      </div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- 평면도형 ----------
  // 꼭짓점 P[i] 에 arc 가 있으면 P[i] → P[i+1] 변이 휜다. arc = 현의 가운데에서 잰 휜 높이(부호가 휘는 쪽)
  const V = (x, y, arc) => arc ? { x, y, arc } : { x, y };
  const Q45 = 1 - Math.SQRT1_2;
  const PRESETS = [
    { name: '직사각형', P: [V(0,0), V(2,0), V(2,4), V(0,4)] },
    { name: '직각삼각형', P: [V(0,0), V(3,0), V(0,4)] },
    { name: '사다리꼴', P: [V(0,0), V(3,0), V(1.5,4), V(0,4)] },
    { name: '반원', P: [V(0,5,2.5), V(0,0)], solid: '구' },
    { name: '사분원', P: [V(0,0), V(3,0,-3 * Q45), V(0,3)], solid: '반구' },
    { name: '떨어진 직사각형', P: [V(1,0), V(3,0), V(3,4), V(1,4)] },
    { name: '삼각형', P: [V(0,0), V(2.5,2), V(0,4)] },
    { name: 'ㄴ자 도형', P: [V(0,0), V(3,0), V(3,1.5), V(1.5,1.5), V(1.5,4), V(0,4)] },
    { name: '직사각형+사분원', P: [V(0,0), V(2,0), V(2,2.5,-2 * Q45), V(0,4.5)], solid: '원기둥 위에 반구를 얹은 모양' },
  ];
  const AXIS_SECTION = {
    '원기둥': '직사각형', '원뿔': '이등변삼각형', '원뿔대': '등변사다리꼴', '구': '원', '반구': '반원',
    '가운데가 빈 원기둥': '직사각형 두 개', '원뿔 두 개를 붙인 모양': '마름모', '원기둥 두 개를 쌓은 모양': '볼록한 십자 모양',
    '원기둥 위에 반구를 얹은 모양': '직사각형 위에 반원을 얹은 모양',
  };

  const S = { P: [], presetSolid: null, sel: -1, angle: 270, mode: 'axis', cut: true, h: 2, step: 0.5, drawing: false };
  const MAXC = 5.5;
  const snap = v => +(Math.round(v / S.step) * S.step).toFixed(4);
  const clampC = v => Math.max(0, Math.min(MAXC, v));
  const eq = (a, b) => Math.abs(a - b) < 1e-6;

  // A→B 를 잇고 가운데가 h 만큼 솟은 원호 위의 점들 (양 끝 제외)
  function arcPts(a, b, h, n) {
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    if (!h || L < 1e-9) return [];
    const nx = -dy / L, ny = dx / L, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const R = (L * L / 4 + h * h) / (2 * Math.abs(h)), sg = Math.sign(h);
    const cx = mx + nx * (h - sg * R), cy = my + ny * (h - sg * R);
    const wrap = t => Math.atan2(Math.sin(t), Math.cos(t));
    const a0 = Math.atan2(a.y - cy, a.x - cx), ap = Math.atan2(my + ny * h - cy, mx + nx * h - cx);
    const total = wrap(ap - a0) + wrap(Math.atan2(b.y - cy, b.x - cx) - ap);
    const out = [];
    for (let k = 1; k < n; k++) { const t = a0 + total * k / n; out.push({ x: Math.max(0, cx + R * Math.cos(t)), y: cy + R * Math.sin(t) }); }
    return out;
  }
  // 곡선 변까지 잘게 편 꼭짓점 목록 (corner = 원래 꼭짓점)
  function flat(P = S.P) {
    const out = [];
    P.forEach((p, i) => {
      out.push({ x: p.x, y: p.y, corner: true });
      if (p.arc) arcPts(p, P[(i + 1) % P.length], p.arc, 24).forEach(q => out.push(q));
    });
    return out;
  }

  function solidName(P) {
    if (S.presetSolid) return S.presetSolid;
    const n = P.length, onAxis = P.filter(p => eq(p.x, 0));
    if (P.some(p => p.arc)) {
      const a = P.find(p => p.arc), b = P[(P.indexOf(a) + 1) % n];
      if (n === 2 && onAxis.length === 2 && eq(Math.abs(a.arc), Math.abs(a.y - b.y) / 2)) return '구';
      return '회전체';
    }
    const edges = P.map((p, i) => [p, P[(i + 1) % n]]);
    const axisAligned = edges.every(([a, b]) => eq(a.x, b.x) || eq(a.y, b.y));
    const minX = Math.min(...P.map(p => p.x));
    if (n === 4 && axisAligned) return eq(minX, 0) ? '원기둥' : '가운데가 빈 원기둥';
    if (n === 3 && onAxis.length === 2) {
      const o = P.find(p => !eq(p.x, 0));
      return onAxis.some(a => eq(a.y, o.y)) ? '원뿔' : '원뿔 두 개를 붙인 모양';
    }
    if (n === 4 && onAxis.length === 2) {
      const off = P.filter(p => !eq(p.x, 0));
      const ys = onAxis.map(p => p.y).sort((a, b) => a - b), oy = off.map(p => p.y).sort((a, b) => a - b);
      if (eq(ys[0], oy[0]) && eq(ys[1], oy[1])) return '원뿔대';
    }
    if (n === 6 && axisAligned && eq(minX, 0)) {
      const xs = new Set(P.filter(p => !eq(p.x, 0)).map(p => p.x));
      if (xs.size === 2) return '원기둥 두 개를 쌓은 모양';
    }
    return '회전체';
  }

  // 높이 y 에서 도형 안쪽인 x 구간들 (회전하면 원 또는 고리가 된다)
  function intervalsAt(F, y) {
    const xs = [], n = F.length;
    for (let i = 0; i < n; i++) {
      const a = F[i], b = F[(i + 1) % n];
      if ((a.y <= y && b.y > y) || (b.y <= y && a.y > y)) xs.push(a.x + (y - a.y) * (b.x - a.x) / (b.y - a.y));
    }
    xs.sort((p, q) => p - q);
    const out = [];
    for (let i = 0; i + 1 < xs.length; i += 2) if (xs[i + 1] - xs[i] > 1e-6) out.push([xs[i], xs[i + 1]]);
    return out;
  }

  // ---------- 모눈 편집기 ----------
  const svg = document.getElementById('editor'), NS = 'http://www.w3.org/2000/svg';
  const U = 48, OX = 36, OY = 300;
  const toPx = p => [OX + p.x * U, OY - p.y * U];
  const pathOf = (pts, close) => 'M ' + pts.map(p => toPx(p).join(' ')).join(' L ') + (close ? ' Z' : '');
  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }
  function drawEditor() {
    svg.innerHTML = '';
    svg.classList.toggle('drawing', S.drawing);
    el('rect', { class: 'bg', x: 0, y: 0, width: 330, height: 330 });
    for (let v = 0; v <= MAXC + 1e-9; v += 0.5) {
      const s = Number.isInteger(v) ? ' s' : '';
      el('line', { class: 'g' + s, x1: OX + v * U, y1: OY - MAXC * U, x2: OX + v * U, y2: OY });
      el('line', { class: 'g' + s, x1: OX, y1: OY - v * U, x2: OX + MAXC * U, y2: OY - v * U });
      if (Number.isInteger(v) && v > 0) {

    document.getElementById('solidName').textContent = solidName(S.P);
    const F = flat(), maxY = Math.max(...F.map(p => p.y)), minY = Math.min(...F.map(p => p.y));
    hIn.min = minY; hIn.max = maxY;
    if (S.h < minY || S.h > maxY) { S.h = +((minY + maxY) / 2).toFixed(2); }
    hIn.value = S.h; hOut.textContent = S.h.toFixed(1);
    drawSection(); build3D();
  }

  loadPreset(0);
  goTo('iso');
  frame();
})();
</script>
